spring:
  application:
    name: acervo-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: acervo

server:
  port: ${PORT:8080}

app:
  admin:
    register-enabled: ${ADMIN_REGISTER_ENABLED:false}
  swagger:
    enabled: ${SWAGGER_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${app.swagger.enabled}
  swagger-ui:
    enabled: ${app.swagger.enabled}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

cors:
  # Lista separada por vírgula. Em dev local, acrescente http://localhost:5173 via CORS_ALLOWED_ORIGINS.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.acervodaatletabrasileira.com.br,https://acervodaatletabrasileira.com.br,https://acervo-front-one.vercel.app}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

asaas:
  base-url: https://www.asaas.com/api/v3
  api-key: ${ASAAS_API_KEY:}
  webhook-token: ${ASAAS_WEBHOOK_TOKEN:}

blockchain:
  alchemy-url: ${BLOCKCHAIN_ALCHEMY_URL:}
  private-key: ${BLOCKCHAIN_PRIVATE_KEY:}
  contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x0000000000000000000000000000000000000000}